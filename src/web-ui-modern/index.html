<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirascreen BFDA3480 - Conectar</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(25, 33, 50, 0.65);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #7dd3fc;
      --glow: rgba(56, 189, 248, 0.35);
      --green: #4ade80;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #172554 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
      width: 100%;
      max-width: 920px;
      position: relative;
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 2.8rem 2.2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 360px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 35px rgba(56, 189, 248, 0.08);
      position: relative;
    }

    .step-badge {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 10px;
    }

    .keys-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin: 2rem 0;
    }

    .key {
      background: linear-gradient(180deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.05) 100%);
      border: 1.5px solid rgba(125, 211, 252, 0.45);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4), 0 0 20px var(--glow);
      border-radius: 16px;
      min-width: 96px;
      height: 84px;
      padding: 0 1.5rem;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .plus {
      font-size: 2.2rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .action-label {
      font-size: 1.45rem;
      font-weight: 500;
      color: #f1f5f9;
      margin-top: 0.5rem;
    }

    .cast-icon {
      color: #cbd5e1;
      margin-top: 0.5rem;
    }

    .device-name {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.15;
      color: #e0f2fe;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.55);
      margin: 1rem 0;
      word-break: break-word;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: rgba(34, 197, 94, 0.14);
      border: 1.5px solid rgba(74, 222, 128, 0.5);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
      color: #86efac;
      padding: 0.55rem 1.35rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 500;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    footer {
      margin-top: 2.2rem;
      color: var(--muted);
      font-size: 0.9rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .net-badge {
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <main class="grid">
    <!-- PASO 1 -->
    <section class="card">
      <span class="step-badge">Paso 1</span>
      <div class="keys-wrapper">
        <div class="key" aria-label="Tecla Windows">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="#e0f2fe">
            <path d="M3 5.5L10.5 4.5V11.5H3V5.5ZM3 18.5L10.5 19.5V12.5H3V18.5ZM11.5 4.35L21 3V11.5H11.5V4.35ZM11.5 19.65L21 21V12.5H11.5V19.65Z"/>
          </svg>
        </div>
        <span class="plus">+</span>
        <div class="key">K</div>
      </div>
      <div class="action-label">Presiona Windows + K</div>
    </section>

    <!-- PASO 2 -->
    <section class="card">
      <span class="step-badge">Paso 2</span>
      <div class="cast-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
          <line x1="2" y1="20" x2="2.01" y2="20"/>
        </svg>
      </div>
      <div class="device-name" id="device-ssid">Mirascreen<br>BFDA3480</div>
      <div class="status-pill">
        <span class="dot"></span>
        <span id="status-text">Listo para conectar</span>
      </div>
    </section>
  </main>

  <footer>
    <span>Enlace activo: <strong class="net-badge" id="net-mode">Wi-Fi / RJ45</strong></span>
    <span>IP: <strong class="net-badge" id="net-ip">192.168.49.1</strong></span>
  </footer>

  <script>
    // Consulta ligera del estado del adaptador USB-RJ45 si existe /net_status.json
    async function pollNetwork() {
      try {
        const res = await fetch('net_status.json?t=' + Date.now());
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('net-ip').textContent = data.ip || '192.168.49.1';
        document.getElementById('net-mode').textContent =
          data.mode === 'ETH' ? 'Ethernet RJ45 (eth0)' : 'Wi-Fi SoftAP';
      } catch (e) {}
    }
    pollNetwork();
    setInterval(pollNetwork, 5000);
  </script>
</body>
</html>
